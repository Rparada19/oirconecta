# Render Blueprint para OírConecta.
# - oirconecta-api: web service Node (backend Express), ya existente.
# - oirconecta-web: static site (frontend Vite), nuevo. Sirve oirconecta.com.
# Para crear/actualizar servicios desde este archivo: Render Dashboard → New +
# → Blueprint → conecta este repo. Las env vars sensibles (DATABASE_URL,
# JWT_SECRET, RESEND_API_KEY, SMTP_*) se siguen administrando en el dashboard.

services:
  - type: web
    name: oirconecta-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/public/retail-config
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: oirconecta-web
    runtime: static
    rootDir: oirconecta
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://oirconecta-api.onrender.com
    routes:
      # Proxy del API: `oirconecta.com/api/*` → backend. Mismo origen → no CORS
      # y no depende de VITE_API_URL en build time. El frontend usa rutas
      # relativas y siempre cae aquí.
      - type: rewrite
        source: /api/*
        destination: https://oirconecta-api.onrender.com/api/:splat
      # Sitemap dinámico: lo sirve el backend (incluye blog posts desde DB).
      - type: rewrite
        source: /sitemap.xml
        destination: https://oirconecta-api.onrender.com/sitemap.xml
      # Rutas heredadas del hack SEO en DreamHost: las enviamos al backend
      # para que responda 410 Gone y Google las desindexe.
      - type: rewrite
        source: /items/*
        destination: https://oirconecta-api.onrender.com/gone/items
      - type: rewrite
        source: /shop/*
        destination: https://oirconecta-api.onrender.com/gone/shop
      - type: rewrite
        source: /wp-content/*
        destination: https://oirconecta-api.onrender.com/gone/wp-content
      - type: rewrite
        source: /wp-includes/*
        destination: https://oirconecta-api.onrender.com/gone/wp-includes
      - type: rewrite
        source: /wp-admin/*
        destination: https://oirconecta-api.onrender.com/gone/wp-admin
      # Patrones de WordPress viejo ("El mundo del sonido") que Google aún indexa.
      # Ninguno colisiona con rutas del sitio nuevo. 410 → Google los desindexa.
      - type: rewrite
        source: /doctors/*
        destination: https://oirconecta-api.onrender.com/gone/doctors
      - type: rewrite
        source: /category/*
        destination: https://oirconecta-api.onrender.com/gone/category
      - type: rewrite
        source: /tag/*
        destination: https://oirconecta-api.onrender.com/gone/tag
      - type: rewrite
        source: /author/*
        destination: https://oirconecta-api.onrender.com/gone/author
      - type: rewrite
        source: /feed/*
        destination: https://oirconecta-api.onrender.com/gone/feed
      - type: rewrite
        source: /wp-json/*
        destination: https://oirconecta-api.onrender.com/gone/wp-json
      - type: rewrite
        source: /xmlrpc.php
        destination: https://oirconecta-api.onrender.com/gone/xmlrpc
      # Slugs de artículos WordPress viejos (root-level) confirmados en el SERP.
      # Añadir aquí los que falten según la lista de GSC (Páginas → indexadas).
      - type: rewrite
        source: /como-funciona-la-audicion/*
        destination: https://oirconecta-api.onrender.com/gone/legacy
      - type: rewrite
        source: /un-mundo-de-tecnologia-en-los-audifonos/*
        destination: https://oirconecta-api.onrender.com/gone/legacy
      - type: rewrite
        source: /que-son-audifonos-medicados-y-por-que-son-recomendados-por-especialistas/*
        destination: https://oirconecta-api.onrender.com/gone/legacy
      - type: rewrite
        source: /escuchando-en-silencio-comprendiendo-la-perdida-auditiva/*
        destination: https://oirconecta-api.onrender.com/gone/legacy
      - type: rewrite
        source: /que-debo-saber-sobre-los-implantes-cocleares/*
        destination: https://oirconecta-api.onrender.com/gone/legacy
      - type: rewrite
        source: /ejercicios-que-nos-ayudan-a-adaptarnos-a-los-audifonos-e-implantes/*
        destination: https://oirconecta-api.onrender.com/gone/legacy
      - type: rewrite
        source: /entrenamiento-auditivo-y-rehabilitacion-auditiva/*
        destination: https://oirconecta-api.onrender.com/gone/legacy
      # Prerender (SSG): servir el HTML generado para URLs limpias (sin barra),
      # ANTES del catch-all. Las páginas viven en dist/<ruta>/index.html.
      # Hubs de un solo segmento:
      - { type: rewrite, source: "/nosotros", destination: "/nosotros/index.html" }
      - { type: rewrite, source: "/servicios", destination: "/servicios/index.html" }
      - { type: rewrite, source: "/contacto", destination: "/contacto/index.html" }
      - { type: rewrite, source: "/agendar", destination: "/agendar/index.html" }
      - { type: rewrite, source: "/comparador", destination: "/comparador/index.html" }
      - { type: rewrite, source: "/ponte-en-sus-oidos", destination: "/ponte-en-sus-oidos/index.html" }
      - { type: rewrite, source: "/ecommerce", destination: "/ecommerce/index.html" }
      - { type: rewrite, source: "/audifonos", destination: "/audifonos/index.html" }
      - { type: rewrite, source: "/implantes", destination: "/implantes/index.html" }
      - { type: rewrite, source: "/blog", destination: "/blog/index.html" }
      - { type: rewrite, source: "/directorio", destination: "/directorio/index.html" }
      - { type: rewrite, source: "/directorio/listado", destination: "/directorio/listado/index.html" }
      - { type: rewrite, source: "/profesionales/audiologos", destination: "/profesionales/audiologos/index.html" }
      - { type: rewrite, source: "/profesionales/otologos", destination: "/profesionales/otologos/index.html" }
      # Secciones con páginas hoja prerenderizadas (marcas, implantes, blog, profesiones).
      # NO incluye /directorio/profesional/* (ese es ruta de cliente → cae al catch-all).
      - { type: rewrite, source: "/audifonos/*", destination: "/audifonos/:splat/index.html" }
      - { type: rewrite, source: "/implantes/*", destination: "/implantes/:splat/index.html" }
      - { type: rewrite, source: "/blog/*", destination: "/blog/:splat/index.html" }
      - { type: rewrite, source: "/directorio/profesion/*", destination: "/directorio/profesion/:splat/index.html" }
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Assets con hash en el nombre: cache larga e inmutable.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html / rutas SPA: nunca cachear, así tras cada deploy el navegador
      # siempre recibe el HTML nuevo apuntando a los chunks actuales (evita
      # "Importing a module script failed"). /assets/* es más específica y gana.
      - path: /*
        name: Cache-Control
        value: no-cache, must-revalidate
